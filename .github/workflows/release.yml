name: release

# Pushing a tag like v0.1.0 builds the binaries for every platform and publishes
# a GitHub release with them and checksums.txt (what install.sh and the in-app
# updater verify). Tags with a "-" (v0.2.0-rc1) are published as prereleases,
# which the updater ignores.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-go@v5
        with: { go-version-file: apps/server/go.mod, cache-dependency-path: apps/server/go.mod }
      - run: make lint
      - run: make test
      - run: make web
      - run: scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* $prerelease \
            --title "DockDuck $GITHUB_REF_NAME" --generate-notes
