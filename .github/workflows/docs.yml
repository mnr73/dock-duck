name: docs

# Builds the documentation site (docs/) and publishes it to GitHub Pages:
# https://mnr73.github.io/dock-duck/
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml", "install.sh"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: pnpm/action-setup@v4
        with: { version: 12 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dockduck/docs build
      # the installer is served from the docs site too: https://mnr73.github.io/dock-duck/install.sh
      - run: cp install.sh docs/.vitepress/dist/install.sh
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs/.vitepress/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
