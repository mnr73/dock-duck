# DockDuck behind nginx. Put this in /etc/nginx/conf.d/dockduck.conf and adjust
# server_name and the certificate paths. DockDuck itself listens on 127.0.0.1:9473.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name duck.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name duck.example.com;

    ssl_certificate     /etc/letsencrypt/live/duck.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duck.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:9473;
        proxy_http_version 1.1;

        # DockDuck needs the real host and scheme: its CSRF/Origin check compares
        # them, and it marks the session cookie Secure when the scheme is https.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;

        # logs, terminals and live updates are WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # a terminal or a log can sit idle for a long time
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
